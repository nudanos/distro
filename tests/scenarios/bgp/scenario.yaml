# BGP (translated from nudanos/tests Test_Automation/script/BGP_DANOS.robot;
# see README.md for the check-to-goal mapping). Addressing follows
# BGP_DANOS_testdata.robot without the LAN hosts: R1-R2 201.1.1.0/24,
# R2-R3 202.1.1.0/24, R2-R4 203.1.1.0/24, R3-R4 204.1.1.0/24,
# R1-R4 205.1.1.0/24 (.3 the first router named, .4 the second), loopbacks
# lo5 1.1.1.N/32. AS 100 (R1), 200 (R2, R3, R4). Each phase deletes the
# previous phase's BGP and static routes on the routers it reconfigures.
name: bgp
gating: true
routers:
  R1:
    config:
      - set interfaces loopback lo5 address 1.1.1.1/32
      - set interfaces dataplane ${R1:R2} address 201.1.1.3/24
      - set interfaces dataplane ${R1:R4} address 205.1.1.3/24
  R2:
    config:
      - set interfaces loopback lo5 address 1.1.1.2/32
      - set interfaces dataplane ${R2:R1} address 201.1.1.4/24
      - set interfaces dataplane ${R2:R3} address 202.1.1.3/24
      - set interfaces dataplane ${R2:R4} address 203.1.1.3/24
  R3:
    config:
      - set interfaces loopback lo5 address 1.1.1.3/32
      - set interfaces dataplane ${R3:R2} address 202.1.1.4/24
      - set interfaces dataplane ${R3:R4} address 204.1.1.3/24
  R4:
    config:
      - set interfaces loopback lo5 address 1.1.1.4/32
      - set interfaces dataplane ${R4:R2} address 203.1.1.4/24
      - set interfaces dataplane ${R4:R3} address 204.1.1.4/24
      - set interfaces dataplane ${R4:R1} address 205.1.1.4/24
links:
  - [R1, R2]
  - [R2, R3]
  - [R2, R4]
  - [R3, R4]
  - [R1, R4]
show:
  - show protocols bgp all summary
  - show protocols bgp ipv4 unicast
checks:
  # 1. eBGP between directly connected neighbors (R1 AS 100 - R2 AS 200)
  - name: "phase 1: R1 eBGP to R2"
    router: R1
    action:
      configure:
        - set protocols bgp 100 parameters router-id 1.1.1.1
        - set protocols bgp 100 parameters ebgp-requires-policy disabled
        - set protocols bgp 100 neighbor 201.1.1.4 remote-as 200
        - set protocols bgp 100 neighbor 201.1.1.4 address-family ipv4-unicast
        - set protocols bgp 100 address-family ipv4-unicast network 1.1.1.1/32
      commit: true
  - name: "phase 1: R2 eBGP to R1"
    router: R2
    action:
      configure:
        - set protocols bgp 200 parameters router-id 1.1.1.2
        - set protocols bgp 200 parameters ebgp-requires-policy disabled
        - set protocols bgp 200 neighbor 201.1.1.3 remote-as 100
        - set protocols bgp 200 neighbor 201.1.1.3 address-family ipv4-unicast
      commit: true
  - name: "eBGP direct: R2 learns R1's loopback from 201.1.1.3"
    router: R2
    timeout: 5m
    op: {command: show protocols bgp ipv4 unicast 1.1.1.1, want: "201\\.1\\.1\\.3 from 201\\.1\\.1\\.3"}
  - name: "eBGP direct: ping R1 from R2"
    router: R2
    op: {command: "ping 201.1.1.3 count 3", want: " 0% packet loss"}

  # 2. eBGP multihop: loopback to loopback across the R1-R2 link
  - name: "phase 2: R1 eBGP multihop to R2's loopback"
    router: R1
    action:
      configure:
        - delete protocols bgp
        - set protocols static route 1.1.1.2/32 next-hop 201.1.1.4
        - set protocols bgp 100 parameters router-id 1.1.1.1
        - set protocols bgp 100 parameters ebgp-requires-policy disabled
        - set protocols bgp 100 neighbor 1.1.1.2 remote-as 200
        - set protocols bgp 100 neighbor 1.1.1.2 ebgp-multihop 3
        - set protocols bgp 100 neighbor 1.1.1.2 update-source 1.1.1.1
        - set protocols bgp 100 neighbor 1.1.1.2 address-family ipv4-unicast
        - set protocols bgp 100 address-family ipv4-unicast network 1.1.1.1/32
      commit: true
  - name: "phase 2: R2 eBGP multihop to R1's loopback"
    router: R2
    action:
      configure:
        - delete protocols bgp
        - set protocols static route 1.1.1.1/32 next-hop 201.1.1.3
        - set protocols bgp 200 parameters router-id 1.1.1.2
        - set protocols bgp 200 parameters ebgp-requires-policy disabled
        - set protocols bgp 200 neighbor 1.1.1.1 remote-as 100
        - set protocols bgp 200 neighbor 1.1.1.1 ebgp-multihop 3
        - set protocols bgp 200 neighbor 1.1.1.1 update-source 1.1.1.2
        - set protocols bgp 200 neighbor 1.1.1.1 address-family ipv4-unicast
      commit: true
  - name: "eBGP multihop: R2 learns 1.1.1.1/32 over the loopback session"
    router: R2
    timeout: 5m
    op: {command: show protocols bgp ipv4 unicast 1.1.1.1, want: "from 1\\.1\\.1\\.1 \\(1\\.1\\.1\\.1\\)"}

  # 3. iBGP between directly connected neighbors (R2 - R3, AS 200)
  - name: "phase 3: R1 stops"
    router: R1
    action:
      configure: [delete protocols bgp, delete protocols static]
      commit: true
  - name: "phase 3: R2 iBGP to R3"
    router: R2
    action:
      configure:
        - delete protocols bgp
        - delete protocols static
        - set protocols bgp 200 parameters router-id 1.1.1.2
        - set protocols bgp 200 neighbor 202.1.1.4 remote-as 200
        - set protocols bgp 200 neighbor 202.1.1.4 address-family ipv4-unicast
        - set protocols bgp 200 address-family ipv4-unicast network 1.1.1.2/32
      commit: true
  - name: "phase 3: R3 iBGP to R2"
    router: R3
    action:
      configure:
        - set protocols bgp 200 parameters router-id 1.1.1.3
        - set protocols bgp 200 neighbor 202.1.1.3 remote-as 200
        - set protocols bgp 200 neighbor 202.1.1.3 address-family ipv4-unicast
      commit: true
  - name: "iBGP direct: R3 learns 1.1.1.2/32 from 202.1.1.3"
    router: R3
    timeout: 5m
    op: {command: show protocols bgp ipv4 unicast 1.1.1.2, want: "202\\.1\\.1\\.3 from 202\\.1\\.1\\.3"}

  # 4. iBGP multihop: loopback to loopback (static routes to the loopbacks)
  - name: "phase 4: R2 iBGP to R3's loopback"
    router: R2
    action:
      configure:
        - delete protocols bgp
        - set protocols static route 1.1.1.3/32 next-hop 202.1.1.4
        - set protocols bgp 200 parameters router-id 1.1.1.2
        - set protocols bgp 200 neighbor 1.1.1.3 remote-as 200
        - set protocols bgp 200 neighbor 1.1.1.3 update-source 1.1.1.2
        - set protocols bgp 200 neighbor 1.1.1.3 address-family ipv4-unicast
        - set protocols bgp 200 address-family ipv4-unicast network 1.1.1.2/32
      commit: true
  - name: "phase 4: R3 iBGP to R2's loopback"
    router: R3
    action:
      configure:
        - delete protocols bgp
        - set protocols static route 1.1.1.2/32 next-hop 202.1.1.3
        - set protocols bgp 200 parameters router-id 1.1.1.3
        - set protocols bgp 200 neighbor 1.1.1.2 remote-as 200
        - set protocols bgp 200 neighbor 1.1.1.2 update-source 1.1.1.3
        - set protocols bgp 200 neighbor 1.1.1.2 address-family ipv4-unicast
      commit: true
  - name: "iBGP multihop: R3 learns 1.1.1.2/32 over the loopback session"
    router: R3
    timeout: 5m
    op: {command: show protocols bgp ipv4 unicast 1.1.1.2, want: "from 1\\.1\\.1\\.2 \\(1\\.1\\.1\\.2\\)"}

  # 5. Route reflection: everyone in AS 200, R4 reflects for clients R2 and
  # R3; R1 is a non-client (the suite's three rules)
  - name: "phase 5: R1 non-client of R4"
    router: R1
    action:
      configure:
        - set protocols bgp 200 parameters router-id 1.1.1.1
        - set protocols bgp 200 neighbor 205.1.1.4 remote-as 200
        - set protocols bgp 200 neighbor 205.1.1.4 address-family ipv4-unicast
        - set protocols bgp 200 address-family ipv4-unicast network 1.1.1.1/32
      commit: true
  - name: "phase 5: R2 client of R4"
    router: R2
    action:
      configure:
        - delete protocols bgp
        - delete protocols static
        - set protocols bgp 200 parameters router-id 1.1.1.2
        - set protocols bgp 200 neighbor 203.1.1.4 remote-as 200
        - set protocols bgp 200 neighbor 203.1.1.4 address-family ipv4-unicast
        - set protocols bgp 200 address-family ipv4-unicast network 1.1.1.2/32
      commit: true
  - name: "phase 5: R3 client of R4"
    router: R3
    action:
      configure:
        - delete protocols bgp
        - delete protocols static
        - set protocols bgp 200 parameters router-id 1.1.1.3
        - set protocols bgp 200 neighbor 204.1.1.4 remote-as 200
        - set protocols bgp 200 neighbor 204.1.1.4 address-family ipv4-unicast
      commit: true
  - name: "phase 5: R4 reflects for R2 and R3"
    router: R4
    action:
      configure:
        - set protocols bgp 200 parameters router-id 1.1.1.4
        - set protocols bgp 200 neighbor 203.1.1.3 remote-as 200
        - set protocols bgp 200 neighbor 203.1.1.3 address-family ipv4-unicast route-reflector-client
        - set protocols bgp 200 neighbor 204.1.1.3 remote-as 200
        - set protocols bgp 200 neighbor 204.1.1.3 address-family ipv4-unicast route-reflector-client
        - set protocols bgp 200 neighbor 205.1.1.3 remote-as 200
        - set protocols bgp 200 neighbor 205.1.1.3 address-family ipv4-unicast
      commit: true
  - name: "route reflection, client to client: R3 learns R2's prefix with ORIGINATOR_ID"
    router: R3
    timeout: 5m
    op: {command: show protocols bgp ipv4 unicast 1.1.1.2, want: "Originator: 1\\.1\\.1\\.2"}
  - name: "route reflection, client to non-client: R1 learns R2's prefix"
    router: R1
    timeout: 5m
    op: {command: show protocols bgp ipv4 unicast 1.1.1.2, want: "Originator: 1\\.1\\.1\\.2"}
  - name: "route reflection, non-client to client: R3 learns R1's prefix"
    router: R3
    timeout: 5m
    op: {command: show protocols bgp ipv4 unicast 1.1.1.1, want: "Originator: 1\\.1\\.1\\.1"}

  # 6. Next hop: R1 (AS 100) eBGP to R2, R2 iBGP to R3
  - name: "phase 6: R1 eBGP to R2 again"
    router: R1
    action:
      configure:
        - delete protocols bgp
        - set protocols bgp 100 parameters router-id 1.1.1.1
        - set protocols bgp 100 parameters ebgp-requires-policy disabled
        - set protocols bgp 100 neighbor 201.1.1.4 remote-as 200
        - set protocols bgp 100 neighbor 201.1.1.4 address-family ipv4-unicast
        - set protocols bgp 100 address-family ipv4-unicast network 1.1.1.1/32
      commit: true
  - name: "phase 6: R2 eBGP to R1, iBGP to R3"
    router: R2
    action:
      configure:
        - delete protocols bgp
        - set protocols bgp 200 parameters router-id 1.1.1.2
        - set protocols bgp 200 parameters ebgp-requires-policy disabled
        - set protocols bgp 200 neighbor 201.1.1.3 remote-as 100
        - set protocols bgp 200 neighbor 201.1.1.3 address-family ipv4-unicast
        - set protocols bgp 200 neighbor 202.1.1.4 remote-as 200
        - set protocols bgp 200 neighbor 202.1.1.4 address-family ipv4-unicast
      commit: true
  - name: "phase 6: R3 iBGP to R2"
    router: R3
    action:
      configure:
        - delete protocols bgp
        - set protocols bgp 200 parameters router-id 1.1.1.3
        - set protocols bgp 200 neighbor 202.1.1.3 remote-as 200
        - set protocols bgp 200 neighbor 202.1.1.3 address-family ipv4-unicast
      commit: true
  - name: "phase 6: R4 stops"
    router: R4
    action:
      configure: [delete protocols bgp]
      commit: true
  - name: "next hop: without next-hop-self R3 sees the eBGP next hop 201.1.1.3"
    router: R3
    timeout: 5m
    op: {command: show protocols bgp ipv4 unicast 1.1.1.1, want: "201\\.1\\.1\\.3[^\\n]* from 202\\.1\\.1\\.3"}
  - name: "phase 6: next-hop-self on R2 toward R3"
    router: R2
    action:
      configure: ["set protocols bgp 200 neighbor 202.1.1.4 address-family ipv4-unicast nexthop-self"]
      commit: true
  - name: "next hop: with next-hop-self R3 sees 202.1.1.3"
    router: R3
    timeout: 5m
    op: {command: show protocols bgp ipv4 unicast 1.1.1.1, want: "202\\.1\\.1\\.3 from 202\\.1\\.1\\.3"}

  # 7. iBGP vs eBGP: R4 learns 1.1.1.1/32 from R1 (eBGP) and R2 (iBGP)
  - name: "phase 7: R1 eBGP to R4 as well"
    router: R1
    action:
      configure:
        - set protocols bgp 100 neighbor 205.1.1.4 remote-as 200
        - set protocols bgp 100 neighbor 205.1.1.4 address-family ipv4-unicast
      commit: true
  - name: "phase 7: R2 iBGP to R4 with next-hop-self"
    router: R2
    action:
      configure:
        - set protocols bgp 200 neighbor 203.1.1.4 remote-as 200
        - set protocols bgp 200 neighbor 203.1.1.4 address-family ipv4-unicast nexthop-self
      commit: true
  - name: "phase 7: R4 eBGP to R1, iBGP to R2"
    router: R4
    action:
      configure:
        - set protocols bgp 200 parameters router-id 1.1.1.4
        - set protocols bgp 200 parameters ebgp-requires-policy disabled
        - set protocols bgp 200 neighbor 205.1.1.3 remote-as 100
        - set protocols bgp 200 neighbor 205.1.1.3 address-family ipv4-unicast
        - set protocols bgp 200 neighbor 203.1.1.3 remote-as 200
        - set protocols bgp 200 neighbor 203.1.1.3 address-family ipv4-unicast
      commit: true
  - name: "iBGP vs eBGP: R4 has both paths"
    router: R4
    timeout: 5m
    op: {command: show protocols bgp ipv4 unicast 1.1.1.1, want: "203\\.1\\.1\\.3 from 203\\.1\\.1\\.3[\\s\\S]*205\\.1\\.1\\.3 from 205\\.1\\.1\\.3|205\\.1\\.1\\.3 from 205\\.1\\.1\\.3[\\s\\S]*203\\.1\\.1\\.3 from 203\\.1\\.1\\.3"}
  - name: "iBGP vs eBGP: the eBGP path is best"
    router: R4
    timeout: 5m
    op: {command: show protocols bgp ipv4 unicast 1.1.1.1, want: "205\\.1\\.1\\.3 from 205\\.1\\.1\\.3 [^\\n]*\\n[^\\n]*external, best"}

  # 8. Local preference: R2 sets 300 on what it sends its iBGP peers
  - name: "phase 8: default local preference 300 on R2"
    router: R2
    action:
      configure: ["set protocols bgp 200 parameters default local-pref 300"]
      commit: true
  - name: "phase 8: reset R2's sessions so its peers get the new default (as the suite does; 2105's FRR does not re-advertise on its own)"
    router: R2
    op: {command: reset protocols bgp all neighbor, want: ""}
  - name: "local preference: R3's path from R2 carries localpref 300"
    router: R3
    timeout: 5m
    op: {command: show protocols bgp ipv4 unicast 1.1.1.1, want: "localpref 300"}
  - name: show output after phase 8
    capture_show: true

  # 9. Confederation: AS 200 as sub-ASes 65002 (R2) and 65003 (R3, R4)
  - name: "phase 9: R1 peers with AS 200 on R2 and R4"
    router: R1
    action:
      configure:
        - delete protocols bgp
        - set protocols bgp 100 parameters router-id 1.1.1.1
        - set protocols bgp 100 parameters ebgp-requires-policy disabled
        - set protocols bgp 100 neighbor 201.1.1.4 remote-as 200
        - set protocols bgp 100 neighbor 201.1.1.4 address-family ipv4-unicast
        - set protocols bgp 100 neighbor 205.1.1.4 remote-as 200
        - set protocols bgp 100 neighbor 205.1.1.4 address-family ipv4-unicast
        - set protocols bgp 100 address-family ipv4-unicast network 1.1.1.1/32
      commit: true
  - name: "phase 9: R2 in sub-AS 65002"
    router: R2
    action:
      configure:
        - delete protocols bgp
        - set protocols bgp 65002 parameters router-id 1.1.1.2
        - set protocols bgp 65002 parameters ebgp-requires-policy disabled
        - set protocols bgp 65002 parameters confederation identifier 200
        - set protocols bgp 65002 parameters confederation peers 65003
        - set protocols bgp 65002 neighbor 201.1.1.3 remote-as 100
        - set protocols bgp 65002 neighbor 201.1.1.3 address-family ipv4-unicast
        - set protocols bgp 65002 neighbor 202.1.1.4 remote-as 65003
        - set protocols bgp 65002 neighbor 202.1.1.4 address-family ipv4-unicast
        - set protocols bgp 65002 neighbor 203.1.1.4 remote-as 65003
        - set protocols bgp 65002 neighbor 203.1.1.4 address-family ipv4-unicast
      commit: true
  - name: "phase 9: R3 in sub-AS 65003"
    router: R3
    action:
      configure:
        - delete protocols bgp
        - set protocols bgp 65003 parameters router-id 1.1.1.3
        - set protocols bgp 65003 parameters ebgp-requires-policy disabled
        - set protocols bgp 65003 parameters confederation identifier 200
        - set protocols bgp 65003 parameters confederation peers 65002
        - set protocols bgp 65003 neighbor 202.1.1.3 remote-as 65002
        - set protocols bgp 65003 neighbor 202.1.1.3 address-family ipv4-unicast
        - set protocols bgp 65003 neighbor 204.1.1.4 remote-as 65003
        - set protocols bgp 65003 neighbor 204.1.1.4 address-family ipv4-unicast
        - set protocols bgp 65003 address-family ipv4-unicast network 1.1.1.3/32
      commit: true
  - name: "phase 9: R4 in sub-AS 65003"
    router: R4
    action:
      configure:
        - delete protocols bgp
        - set protocols bgp 65003 parameters router-id 1.1.1.4
        - set protocols bgp 65003 parameters ebgp-requires-policy disabled
        - set protocols bgp 65003 parameters confederation identifier 200
        - set protocols bgp 65003 parameters confederation peers 65002
        - set protocols bgp 65003 neighbor 205.1.1.3 remote-as 100
        - set protocols bgp 65003 neighbor 205.1.1.3 address-family ipv4-unicast
        - set protocols bgp 65003 neighbor 203.1.1.3 remote-as 65002
        - set protocols bgp 65003 neighbor 203.1.1.3 address-family ipv4-unicast
        - set protocols bgp 65003 neighbor 204.1.1.3 remote-as 65003
        - set protocols bgp 65003 neighbor 204.1.1.3 address-family ipv4-unicast
      commit: true
  - name: "confederation: R3 sees the sub-AS path (65002) 100 to R1's prefix"
    router: R3
    timeout: 5m
    op: {command: show protocols bgp ipv4 unicast 1.1.1.1, want: "\\(65002\\) 100"}
  - name: "confederation: R1 sees R3's prefix from AS 200"
    router: R1
    timeout: 5m
    op: {command: show protocols bgp ipv4 unicast 1.1.1.3, want: "(?m)^\\s+200$"}
  - name: "confederation: R1 sees no sub-AS"
    router: R1
    op: {command: show protocols bgp ipv4 unicast 1.1.1.3, want: "6500[23]", absent: true}

  # 10. Dampening on R2; R1's network flaps twice
  - name: "phase 10: dampening on R2"
    router: R2
    action:
      configure: ["set protocols bgp 65002 address-family ipv4-unicast parameters dampening"]
      commit: true
  - name: "phase 10: flap 1 down"
    router: R1
    action:
      configure: ["delete protocols bgp 100 address-family ipv4-unicast network 1.1.1.1/32"]
      commit: true
  - name: "phase 10: flap 1 withdrawn on R2"
    router: R2
    timeout: 5m
    op: {command: show protocols bgp ipv4 unicast dampening flap-statistics, want: "1\\.1\\.1\\.1/32"}
  - name: "phase 10: flap 1 up"
    router: R1
    action:
      configure: ["set protocols bgp 100 address-family ipv4-unicast network 1.1.1.1/32"]
      commit: true
  - name: "phase 10: flap 2 down"
    router: R1
    action:
      configure: ["delete protocols bgp 100 address-family ipv4-unicast network 1.1.1.1/32"]
      commit: true
  - name: "phase 10: flap 2 up"
    router: R1
    action:
      configure: ["set protocols bgp 100 address-family ipv4-unicast network 1.1.1.1/32"]
      commit: true
  - name: "dampening: R2 counts two flaps of 1.1.1.1/32"
    router: R2
    timeout: 5m
    op: {command: show protocols bgp ipv4 unicast dampening flap-statistics, want: "1\\.1\\.1\\.1/32\\s+\\S+\\s+2\\s"}
