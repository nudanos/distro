# NuDanOS live ISO. The serial console lets the boot test drive it.
# hooks/live/02-live-vmlinuz.binary renames the kernel to /live/vmlinuz after
# live-build writes this file, so the paths are fixed (as in DANOS).
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
set default=0
set timeout=5
menuentry "NuDanOS (live)" {
	linux /live/vmlinuz boot=live components console=tty0 console=ttyS0,115200 net.ifnames=1 nopersistent nonetworking noeject systemd.show_status=1
	initrd /live/initrd.img
}
menuentry "NuDanOS (live, debug)" {
	linux /live/vmlinuz boot=live components console=tty0 console=ttyS0,115200 net.ifnames=1 nopersistent nonetworking noeject systemd.show_status=1 debug verbose noautologin
	initrd /live/initrd.img
}
