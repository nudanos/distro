name: nightly
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-24.04
    # The signing key lives only in this environment, whose deployment rule
    # admits the main branch alone: no other repo, branch or PR can read it.
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Import archive signing key
        env:
          NUDANOS_ARCHIVE_KEY: ${{ secrets.NUDANOS_ARCHIVE_KEY }}
        run: |
          mkdir -p "$HOME/.nudanos/gnupg" && chmod 700 "$HOME/.nudanos/gnupg"
          printf '%s\n' "$NUDANOS_ARCHIVE_KEY" | GNUPGHOME="$HOME/.nudanos/gnupg" gpg --batch --import
      - uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/work/out
            ${{ runner.temp }}/work/state.json
            ${{ runner.temp }}/work/mirror-state.json
          key: work-nightly-${{ github.run_id }}
          restore-keys: work-nightly-
      - name: Build all ready packages, sign, install the pilot set
        run: |
          go build -o distro-build ./cmd/distro-build
          ./distro-build -work "$RUNNER_TEMP/work" builder
          ./distro-build -work "$RUNNER_TEMP/work" -jobs 2 build
          WORK="$RUNNER_TEMP/work" KEY="$(cat keys/FINGERPRINT)" tests/integration/pilot.sh
      - uses: actions/upload-artifact@v7
        with:
          name: apt-repo
          path: ${{ runner.temp }}/work/repo/
