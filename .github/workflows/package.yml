name: package
on:
  workflow_call:
    inputs:
      package:
        description: manifest name of the calling package repository
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: nudanos/distro
          path: distro
      - uses: actions/checkout@v7
        with:
          path: pkg
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"  # latest 1.26.x; distro/go.mod states the minimum (1.26.0)
      - uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/work/out
            ${{ runner.temp }}/work/logs
            ${{ runner.temp }}/work/state.json
            ${{ runner.temp }}/work/mirror-state.json
          # logs: lint reads compiler warnings and staticcheck from the build
          # log, which a package restored from the cache does not rewrite
          key: work-${{ inputs.package }}-${{ github.run_id }}
          restore-keys: work-${{ inputs.package }}-
      - name: Build this package and its build-dependency closure
        working-directory: distro
        run: |
          go build -o distro-build ./cmd/distro-build
          ./distro-build -work "$RUNNER_TEMP/work" builder
          ./distro-build -work "$RUNNER_TEMP/work" -jobs 2 -local "${{ inputs.package }}=$GITHUB_WORKSPACE/pkg" build "${{ inputs.package }}"
      - name: Lint (no worse than lint-baseline.json)
        # A change that adds findings fails here, before it is merged, rather
        # than in the next nightly. Ports outside the lint scope are skipped.
        working-directory: distro
        run: |
          ./distro-build -work "$RUNNER_TEMP/work" -local "${{ inputs.package }}=$GITHUB_WORKSPACE/pkg" \
            -lint-skip-out-of-scope lint "${{ inputs.package }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: debs-${{ inputs.package }}
          path: ${{ runner.temp }}/work/out/${{ inputs.package }}/
          if-no-files-found: ignore
