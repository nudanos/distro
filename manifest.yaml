  - name: "keepalived"
    kind: "upstream"
    milestone: "1.0"
    ready: true
    upstream: "https://github.com/acassen/keepalived"
    version: "2.4.3"
    tag: "v2.4.3"
    tag_pattern: "^v(\\d+\\.\\d+\\.\\d+)$"
    track: "latest"
    packaging: "https://salsa.debian.org/debian/pkg-keepalived.git"
    packaging_ref: "master"
    exclude: ["www"]
    note: "www/ is in the git tag but not the release tarball (non-free RFC draft)"
    audit:
      - {patch: "v2_2_20_fixup.patch", verdict: kept, note: "keeps dropping syslog.target from the unit; its D-Bus policy half is upstream (2.4.3 scopes send_destination and adds a default deny)"}
      - {patch: "vyatta_if_additions.patch", verdict: kept, note: "vyatta_if_setup() per-VMAC sysctls for RFC interfaces; the rest of the stack builds on it"}
      - {patch: "vyatta_extra_data_structures.patch", verdict: kept, note: "global local-address list used by the RFC and address-overlap code"}
      - {patch: "vyatta_dbus_rfc_additions.patch", verdict: kept, note: "GetRfcMapping, called by vyatta-vrrp (process_control.py)"}
      - {patch: "vyatta_upstream_reversions.patch", verdict: kept, note: "VRRPv2 over IPv6 outside strict mode; 'Virtual IP = N' dump line parsed by vyatta-vrrp"}
      - {patch: "vyatta_rfc_changes.patch", verdict: kept, note: "RFC interface model: VMAC admin down in BACKUP, adverts read through a BPF on the base interface"}
      - {patch: "vyatta_track_interface_changes.patch", verdict: kept, note: "tracking dump format; stack dependency"}
      - {patch: "vyatta_dynamic_ipao_detection.patch", verdict: kept, note: "address-owner detection from the configured priority"}
      - {patch: "vyatta_dbus_reload_function.patch", verdict: kept, note: "ResetMaster, called by vyatta-vrrp (vrrp_group_connection.py)"}
      - {patch: "vyatta_track_route_feature.patch", verdict: kept, note: "track_route_to, written by vyatta-vrrp"}
      - {patch: "vyatta_track_pathmon_feature.patch", verdict: kept, note: "track_pathmon, written by vyatta-vrrp"}
      - {patch: "vyatta_check_lower_is_up.patch", verdict: kept, note: "IFLA_CARRIER counts toward interface state (bonds, VLANs); folded into 2.4's debounced flags"}
      - {patch: "vyatta_vrf_aware.patch", verdict: kept, note: "VMAC placement in routing instances (vrf_aware)"}
      - {patch: "vyatta_preemption.patch", verdict: kept, note: "Vyatta preemption behaviour vyatta-vrrp configures"}
      - {patch: "vyatta_delayed_address_addition_bugfix.patch", verdict: kept, note: "RFC VMACs take the base interface's address; rewritten for 2.4 fault flags"}
      - {patch: "vyatta_snmp_modifications.patch", verdict: kept, note: "defer the SNMP agent until snmpd is up; IPv6 master address in the RFC MIB"}
      - {patch: "vyatta_dynamic_debug_options.patch", verdict: kept, note: "AddDebug/RemoveDebug, called by vyatta-vrrp"}
      - {patch: "vyatta_sync_group_modifications.patch", verdict: kept, note: "sync-group fault count never below zero"}
      - {patch: "vyatta_interface_exists_bugfix.patch", verdict: kept, note: "interface-exists fix; stack dependency"}
