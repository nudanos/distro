    kind: "upstream"
    milestone: "1.0"
    ready: true
    upstream: "https://github.com/perfsonar/owamp"
    version: "5.2.6"
    tag: "v5.2.6"
    tag_pattern: "^v(\\d+\\.\\d+\\.\\d+)$"
    track: "latest"
    subdir: "owamp/owamp"
    packaging_dir: "owamp/owamp/unibuild-packaging/deb"
    note: "built with perfSONAR's own Debian packaging for the release; DANOS's fork packaging targeted 4.2.1"
    audit:
      - {patch: "vyatta/remove-owampd-fts.patch", verdict: dropped, note: "build cleanup"}
      - {patch: "vyatta/Start-Sessions-MBZ-field-can-contain-garbage.patch", verdict: upstreamed, note: "in 5.2.6"}
      - {patch: "vyatta/owampd-no-perror.patch", verdict: dropped, note: "logging only"}
      - {patch: "vyatta/owamp-more-logging.patch", verdict: dropped, note: "logging only"}
      - {patch: "vyatta/stop-sessions-wait-use-ppoll.patch", verdict: kept, note: "closes a signal race in twping's stop wait"}
      - {patch: "vyatta/owampd-run-state.patch", verdict: kept, note: "session state files read by vyatta-service-twamp's show commands"}
      - {patch: "vyatta/owping-control-dscp.patch", verdict: kept, note: "prerequisite of set-dscp-for-control-packets"}
      - {patch: "vyatta/set-dscp-for-control-packets.patch", verdict: kept, note: "controldscpvalue, written by vyatta-service-twamp"}
      - {patch: "vyatta/owping-multiple-sessions.patch", verdict: kept, note: "twping -r (session-count), passed by vyatta-service-twamp"}
      - {patch: "vyatta/dont-print-client-usage-after-invalid-arguments.patch", verdict: dropped, note: "usage text only"}
      - {patch: "vyatta/improve-client-input-validation.patch", verdict: kept, note: "prerequisite: check_errno_erange is used by twamp-configurable-stats-sampling"}
      - {patch: "vyatta/owping-ensure-line-buffered-output.patch", verdict: kept, note: "twping output is read through a pipe by the op commands"}
      - {patch: "vyatta/owamp-no-debug-info-in-logging.patch", verdict: upstreamed, note: "95% of its lines are in 5.2.6"}
      - {patch: "vyatta/owampd-allow-zero-addr-mask.patch", verdict: kept, note: "client prefixes such as 0.0.0.0/0 written by vyatta-service-twamp"}
      - {patch: "vyatta/twamp-no-unnecessary-stats.patch", verdict: kept, note: "stats output format parsed by twping-output-to-json"}
      - {patch: "vyatta/twamp-configurable-stats-sampling.patch", verdict: kept, note: "twping -l (sample), passed by vyatta-service-twamp"}
      - {patch: "vyatta/twamp-fix-refl-seqno.patch", verdict: kept, note: "reflector sequence-number fix (RFC 5357 behaviour)"}
      - {patch: "vyatta/twamp-remove-invalid-empty-test-spec-error.patch", verdict: dropped, note: "log message only"}
      - {patch: "vyatta/default-log-level-debug.patch", verdict: dropped, note: "log level only"}
      - {patch: "vyatta/twamp-dont-compute-error-on-lost-packets.patch", verdict: kept, note: "statistics correctness"}
      - {patch: "vyatta/dont-log-compile-date.patch", verdict: dropped, note: "cosmetic"}
      - {patch: "vyatta/twping-allow-more-immediate-start-time.patch", verdict: dropped, note: "start-time tweak; no consumer option"}
      - {patch: "vyatta/add-check-ut.patch", verdict: dropped, note: "tests for the dropped scheduling patches"}
      - {patch: "vyatta/twamp-schedule-slot-flags.patch", verdict: dropped, note: "cycle-to scheduling is not used by vyatta-service-twamp"}
      - {patch: "vyatta/twamp-cycle-to-scheduling.patch", verdict: dropped, note: "cycle-to scheduling is not used by vyatta-service-twamp"}
      - {patch: "vyatta/twping-cycle-to-schedule.patch", verdict: dropped, note: "cycle-to scheduling is not used by vyatta-service-twamp"}
      - {patch: "vyatta/twping-end-delay.patch", verdict: dropped, note: "vyatta-service-twamp does not pass -E"}
      - {patch: "vyatta/twamp-dataplane-offload.patch", verdict: dropped, note: "needs the DPDK dataplane libraries (milestone 2); vyatta-service-twamp now tolerates the missing offload column"}
